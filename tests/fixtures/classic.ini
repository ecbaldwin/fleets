# hosts before any section land in ungrouped
mail.example.com

[webservers]
web01:2222 http_port=80 maxconn=200
web02 http_port=8080
www[01:03].example.com

[dbservers]
db-[a:c].example.com profile=heavy

[eastcoast:children]
webservers
dbservers

[eastcoast:vars]
region = us-east-1
replicas = 3
enabled = True
tags = ['web', 'db']
ratio = 1.5

[webservers:vars]
ansible_user = deploy
ansible_group_priority = 10
