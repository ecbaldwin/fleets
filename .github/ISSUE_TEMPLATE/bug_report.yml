name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve fleets.
  - type: input
    id: version
    attributes:
      label: fleets version
      placeholder: Output of fleets --version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, a sanitized inventory, expected output, and actual output.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
