name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12
      - run: actionlint
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - run: cargo package --locked --list
      - run: cargo package --locked

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets --no-default-features
      - run: cargo check --locked --all-targets --all-features

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-features

  ansible-differential:
    name: Ansible differential oracle
    runs-on: ubuntu-latest
    env:
      FLEETS_REQUIRE_ANSIBLE: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: mkdir -p "$ANSIBLE_LOCAL_TEMP"
        env:
          ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/ansible-local
      - run: cargo test --locked --test differential
        env:
          ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/ansible-local

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
