[package]
name = "fleets"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, mostly Ansible-compatible inventory CLI"
authors = ["Carl N Baldwin"]
license = "MIT"
repository = "https://github.com/ecbaldwin/fleets"
homepage = "https://github.com/ecbaldwin/fleets"
documentation = "https://docs.rs/fleets"
readme = "README.md"
keywords = ["ansible", "inventory", "automation", "cli"]
categories = ["command-line-utilities", "config"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/bench/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[features]
default = []
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
indexmap = { version = "2.14.0", features = ["serde"] }
noyalib = { version = "0.0.15", features = ["compat-serde-yaml"] }
opentelemetry = { version = "0.33.0", optional = true }
opentelemetry-otlp = { version = "0.33.0", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.0", optional = true, features = ["trace"] }
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["registry", "env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true

# The profile used by cargo-dist for prebuilt release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
